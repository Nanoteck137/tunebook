<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- <link rel="stylesheet" href="%sveltekit.assets%/root.css" /> -->

		<script>
			(function () {
				const lightBg = "oklch(1 0 0)";
				const darkBg = "oklch(0.145 0 0)";

				const mode =
					localStorage.getItem("mode-watcher-mode") ?? "system";
				const dark =
					mode === "dark" ||
					(mode === "system" &&
						matchMedia("(prefers-color-scheme: dark)").matches);

				document.documentElement.style.backgroundColor = dark
					? darkBg
					: lightBg;
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
